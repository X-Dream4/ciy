<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>世界次元</title>
<script src="vue.global.js"></script>
<script src="lucide.min.js"></script>
<script src="notify.js"></script>
<link rel="stylesheet" href="world.css" />
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "821ab26a-5541-4f0e-a63d-fe385e28a417",
      safari_web_id: "web.onesignal.auto.4bf73218-3550-4659-982d-970270d14d2d",
      notifyButton: { enable: false },
      serviceWorkerPath: "OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/ciy/" },
    });
      });
</script>


</head>
<body>
<div id="world-app" v-cloak>

  <div class="world-topbar">
    <button class="world-back-btn" @click="goBack"><i data-lucide="arrow-left"></i></button>
    <div class="world-title">世界次元</div>
<button onclick="openQuickNav()" style="width:12px;height:12px;border-radius:50%;background:#555;border:none;cursor:pointer;padding:0;flex-shrink:0;"></button>
  </div>

  <div class="world-content">
    <div class="world-module-grid">
      <div class="world-module-card" @click="goForum">
        <div class="world-module-icon"><i data-lucide="message-square"></i></div>
        <div class="world-module-name">次元论坛</div>
        <div class="world-module-desc">和各次元角色交流讨论</div>
      </div>
      <div class="world-module-card" @click="goNovel">
        <div class="world-module-icon"><i data-lucide="book-open"></i></div>
        <div class="world-module-name">次元小说</div>
        <div class="world-module-desc">创作与阅读小说</div>
      </div>
      <div class="world-module-card" @click="goManga">
        <div class="world-module-icon"><i data-lucide="image"></i></div>
        <div class="world-module-name">次元漫画</div>
        <div class="world-module-desc">上传与阅读漫画</div>
      </div>

      <div class="world-module-card coming-soon">
        <div class="world-module-icon"><i data-lucide="map"></i></div>
        <div class="world-module-name">次元地图</div>
        <div class="world-module-desc">即将开放</div>
      </div>
      <div class="world-module-card coming-soon">
        <div class="world-module-icon"><i data-lucide="star"></i></div>
        <div class="world-module-name">更多模块</div>
        <div class="world-module-desc">即将开放</div>
      </div>
    </div>
  </div>
<!-- 快捷跳转弹窗 -->
<div id="quick-nav-mask" onclick="closeQuickNav()" style="display:none;position:fixed;inset:0;z-index:9999;background:transparent;">
  <div onclick="event.stopPropagation()" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;max-height:70vh;overflow-y:auto;">
    <div style="width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px;"></div>
    <div style="font-size:15px;font-weight:700;color:#111;margin-bottom:14px;">快捷跳转</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
      <div onclick="location.href='index.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="home" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">主页</span>
      </div>
      <div onclick="location.href='chat.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="message-circle" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">聊天</span>
      </div>
      <div onclick="location.href='like.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="heart" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">喜欢</span>
      </div>
      <div onclick="location.href='world.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="globe" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">世界</span>
      </div>
      <div onclick="location.href='collect.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="bookmark" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">收藏</span>
      </div>
      <div onclick="location.href='share.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="feather" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">涟波</span>
      </div>
      <div onclick="location.href='random.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="shuffle" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">次元发现</span>
      </div>
      <div onclick="location.href='worldbook.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="book-open" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">世界书</span>
      </div>
      <div onclick="location.href='forum.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="users" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">论坛</span>
      </div>
      <div onclick="location.href='novel.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="file-text" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">小说</span>
      </div>
      <div onclick="location.href='manga.html'" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:#f5f5f5;cursor:pointer;">
        <i data-lucide="image" style="width:22px;height:22px;color:#555;"></i>
        <span style="font-size:11px;color:#555;font-weight:500;">漫画</span>
      </div>
    </div>
  </div>
</div>
<script>
function openQuickNav() {
  const el = document.getElementById('quick-nav-mask');
  if (el) { el.style.display = 'block'; if(typeof lucide !== 'undefined') lucide.createIcons(); }
}
function closeQuickNav() {
  const el = document.getElementById('quick-nav-mask');
  if (el) el.style.display = 'none';
}
</script>

</div>
<script src="db.js"></script>
<script src="world.js"></script>
</body>
</html>
